name: CI - Serverless

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oficina_auth_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-tests-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oficina_auth_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OFICINA_TEST_POSTGRES: Host=localhost;Port=5432;Database=oficina_auth_tests;Username=postgres;Password=postgres-tests-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Oficina.Serverless.sln
      - name: Build
        run: dotnet build Oficina.Serverless.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Oficina.Serverless.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serverless-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
      - name: Publish Lambda package
        run: |
          dotnet publish src/Oficina.Autenticacao/Oficina.Autenticacao.csproj --configuration Release --runtime linux-x64 --self-contained false --output artifacts/auth
          cd artifacts/auth
          zip -r ../oficina-autenticacao.zip .
      - name: Save Lambda package
        uses: actions/upload-artifact@v4
        with:
          name: oficina-autenticacao-lambda
          path: artifacts/oficina-autenticacao.zip
          if-no-files-found: error

  validate-terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        run: terraform validate -no-color
      - name: Test AWS contracts without provisioning
        run: terraform test -no-color
